<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Mean, Median & Gaussian Filter</title>
<style>
    body {
        font-family: Arial, sans-serif;
        margin: 20px;
    }

    .channel-container {
        display: flex;
        gap: 10px;
        margin-top: 10px;
        flex-wrap: wrap;
    }

    .channel-block {
        text-align: center;
    }

    canvas {
        border: 1px solid #000;
        margin-top: 5px;
        max-width: 100%;
        height: auto;
    }

    #resolution {
        margin-top: 10px;
    }

    button {
        margin-top: 5px;
        margin-right: 5px;
    }

    button:disabled {
        opacity: 0.6;
        cursor: not-allowed;
    }

    #metrics {
        margin-top: 10px;
        font-size: 14px;
    }
</style>
</head>

<body>
    <h3>Mean, Median & Gaussian Filter</h3>

    <canvas id="gambar"></canvas><br>
    <input type="file" id="file1" accept=".jpg,.jpeg,.png,.bmp"><br>

    <div id="resolution"></div>

    <button id="meanBtn" onclick="applyMeanFilter()" disabled>Mean Filter</button>
    <button id="medianBtn" onclick="applyMedianFilter()" disabled>Median Filter</button>
    <button id="gaussianBtn" onclick="applyGaussianFilter()" disabled>Gaussian Filter</button>

    <div id="metrics"></div>
    <div id="channels" class="channel-container"></div>

    <script>
        let originalImage = null;
        let width = 0, height = 0;
        let originalImageData = null;

        document.getElementById("file1").addEventListener("change", function () {
            loadImage(this, "gambar");
        });

        function loadImage(fileInput, canvasId) {
            const file = fileInput.files[0];
            if (!file) return;

            const canvas = document.getElementById(canvasId);
            const ctx = canvas.getContext("2d");
            const img = new Image();

            img.onload = function () {
                canvas.width = img.width;
                canvas.height = img.height;
                width = img.width;
                height = img.height;

                ctx.drawImage(img, 0, 0);
                originalImage = img;
                originalImageData = ctx.getImageData(0, 0, width, height);

                document.getElementById("meanBtn").disabled = false;
                document.getElementById("medianBtn").disabled = false;
                document.getElementById("gaussianBtn").disabled = false;

                document.getElementById("resolution").textContent =
                    `Resolution: ${img.width} x ${img.height}`;

                clearChannels();
                document.getElementById("metrics").innerHTML = "";
                URL.revokeObjectURL(img.src);
            };

            img.src = URL.createObjectURL(file);
        }

        function clearChannels() {
            document.getElementById("channels").innerHTML = "";
        }

        function createChannelCanvas(label, imgData) {
            const container = document.getElementById("channels");
            const block = document.createElement("div");
            block.className = "channel-block";

            const canvas = document.createElement("canvas");
            canvas.width = width;
            canvas.height = height;

            const ctx = canvas.getContext("2d");
            ctx.putImageData(imgData, 0, 0);

            const caption = document.createElement("p");
            caption.textContent = label;

            block.appendChild(canvas);
            block.appendChild(caption);
            container.appendChild(block);
        }

        function calculateMSE_PSNR(originalData, filteredData) {
            let mse = 0;
            const n = width * height;

            for (let i = 0; i < n * 4; i += 4) {
                const dr = originalData[i] - filteredData[i];
                const dg = originalData[i + 1] - filteredData[i + 1];
                const db = originalData[i + 2] - filteredData[i + 2];

                mse += (dr * dr + dg * dg + db * db) / 3;
            }

            mse /= n;

            if (mse === 0) {
                return { mse: "0.00", psnr: "Infinity" };
            }

            const psnr = 10 * Math.log10(255 * 255 / mse);
            return {
                mse: mse.toFixed(2),
                psnr: psnr.toFixed(2)
            };
        }

        function applyMeanFilter() {
            if (!originalImageData) return;
            clearChannels();

            const imgData = originalImageData;
            const newImgData = new ImageData(width, height);
            const kernelSize = 3;
            const offset = Math.floor(kernelSize / 2);

            for (let y = 0; y < height; y++) {
                for (let x = 0; x < width; x++) {
                    let r = 0, g = 0, b = 0, count = 0;

                    for (let ky = -offset; ky <= offset; ky++) {
                        for (let kx = -offset; kx <= offset; kx++) {
                            const px = x + kx;
                            const py = y + ky;

                            if (px >= 0 && px < width && py >= 0 && py < height) {
                                const i = (py * width + px) * 4;
                                r += imgData.data[i];
                                g += imgData.data[i + 1];
                                b += imgData.data[i + 2];
                                count++;
                            }
                        }
                    }

                    const i = (y * width + x) * 4;
                    newImgData.data[i] = Math.round(r / count);
                    newImgData.data[i + 1] = Math.round(g / count);
                    newImgData.data[i + 2] = Math.round(b / count);
                    newImgData.data[i + 3] = 255;
                }
            }

            showResult("Mean Filter", imgData, newImgData);
        }

        function applyMedianFilter() {
            if (!originalImageData) return;
            clearChannels();

            const imgData = originalImageData;
            const newImgData = new ImageData(width, height);
            const kernelSize = 3;
            const offset = Math.floor(kernelSize / 2);

            for (let y = 0; y < height; y++) {
                for (let x = 0; x < width; x++) {
                    const rVals = [], gVals = [], bVals = [];

                    for (let ky = -offset; ky <= offset; ky++) {
                        for (let kx = -offset; kx <= offset; kx++) {
                            const px = x + kx;
                            const py = y + ky;

                            if (px >= 0 && px < width && py >= 0 && py < height) {
                                const i = (py * width + px) * 4;
                                rVals.push(imgData.data[i]);
                                gVals.push(imgData.data[i + 1]);
                                bVals.push(imgData.data[i + 2]);
                            }
                        }
                    }

                    rVals.sort((a, b) => a - b);
                    gVals.sort((a, b) => a - b);
                    bVals.sort((a, b) => a - b);

                    const mid = Math.floor(rVals.length / 2);
                    const i = (y * width + x) * 4;

                    newImgData.data[i] = rVals[mid];
                    newImgData.data[i + 1] = gVals[mid];
                    newImgData.data[i + 2] = bVals[mid];
                    newImgData.data[i + 3] = 255;
                }
            }

            showResult("Median Filter", imgData, newImgData);
        }

        // Gaussian Filter 3x3 sebagai metode filtering tambahan untuk Exercise Task 1.
        function applyGaussianFilter() {
            if (!originalImageData) return;
            clearChannels();

            const imgData = originalImageData;
            const newImgData = new ImageData(width, height);

            const kernel = [
                [1, 2, 1],
                [2, 4, 2],
                [1, 2, 1]
            ];
            const divisor = 16;
            const offset = 1;

            for (let y = 0; y < height; y++) {
                for (let x = 0; x < width; x++) {
                    let r = 0, g = 0, b = 0;

                    for (let ky = -offset; ky <= offset; ky++) {
                        for (let kx = -offset; kx <= offset; kx++) {
                            const px = Math.min(width - 1, Math.max(0, x + kx));
                            const py = Math.min(height - 1, Math.max(0, y + ky));
                            const i = (py * width + px) * 4;
                            const weight = kernel[ky + offset][kx + offset];

                            r += imgData.data[i] * weight;
                            g += imgData.data[i + 1] * weight;
                            b += imgData.data[i + 2] * weight;
                        }
                    }

                    const i = (y * width + x) * 4;
                    newImgData.data[i] = Math.round(r / divisor);
                    newImgData.data[i + 1] = Math.round(g / divisor);
                    newImgData.data[i + 2] = Math.round(b / divisor);
                    newImgData.data[i + 3] = 255;
                }
            }

            showResult("Gaussian Filter", imgData, newImgData);
        }

        function showResult(label, originalData, resultData) {
            createChannelCanvas(label, resultData);

            const metrics = calculateMSE_PSNR(
                originalData.data,
                resultData.data
            );

            document.getElementById("metrics").innerHTML =
                `Metode: ${label}<br>MSE: ${metrics.mse}, PSNR: ${metrics.psnr} dB`;
        }
    </script>
</body>
</html>
